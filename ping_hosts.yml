---
- name: Test network reachability and print a table
  hosts: all
  gather_facts: false
  tasks:
    - name: Ping the host from the local machine
      delegate_to: localhost
      ansible.builtin.command: ping -c 1 -W 2 {{ inventory_hostname }}
      register: ping_result
      ignore_errors: true
      changed_when: false

    - name: Display reachability results in a tabular format
      run_once: true
      ansible.builtin.debug:
        msg: |
          {{ "%-25s | %-15s | %-20s" | format('Hostname', 'IP Address', 'Connection Status') }}
          --------------------------------------------------------------------
          {% for host in ansible_play_hosts_all %}
          {% set ip = hostvars[host]['ansible_host'] | default(host) %}
          {% set status = 'OK (Reachable)' if hostvars[host]['ping_result']['rc'] == 0 else 'FAILED (Unreachable)' %}
          {{ "%-25s | %-15s | %-20s" | format(host, ip, status) }}
          {% endfor %}
