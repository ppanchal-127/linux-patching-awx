---
- name: Multi-OS Patching and Reboot Cycle
  hosts: all
  become: yes
  tasks:

    # ==========================================
    # Debian / Ubuntu Patching
    # ==========================================
    - name: Debian - Upgrade all packages
      apt:
        update_cache: yes
        upgrade: dist
        autoremove: yes
        autoclean: yes
      when: ansible_os_family == "Debian"

    - name: Debian - Check if reboot is required
      stat:
        path: /var/run/reboot-required
      register: debian_reboot
      when: ansible_os_family == "Debian"

    # ==========================================
    # RHEL / CentOS / Alma / Rocky Patching
    # ==========================================
    - name: RHEL - Upgrade all packages
      dnf:
        name: "*"
        state: latest
      when: ansible_os_family == "RedHat"

    - name: RHEL - Check if reboot is required
      command: dnf needs-restarting -r
      register: rhel_reboot
      failed_when: false
      changed_when: rhel_reboot.rc == 1
      when: ansible_os_family == "RedHat"

    # ==========================================
    # Universal Reboot Handling
    # ==========================================
    - name: Reboot server if required
      reboot:
        msg: "Ansible automated patching reboot"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
      when: >
        (debian_reboot.stat.exists | default(false)) or 
        (rhel_reboot.rc | default(0) == 1)
