---
- name: Multi-OS Patching and Reboot Cycle
  hosts: all
  become: yes
  tasks:

    # ==========================================
    # Pre-Flight Checks
    # ==========================================
    - name: Verify internet connectivity before patching
      uri:
        url: http://www.google.com
        method: HEAD
        timeout: 10
      register: internet_check
      # If this fails, Ansible stops execution for the host automatically.

    # ==========================================
    # Debian / Ubuntu (APT)
    # ==========================================
    - name: APT - Update cache and upgrade all packages
      apt:
        update_cache: yes
        upgrade: dist
        autoremove: yes
        autoclean: yes
      register: apt_upgrade_result
      when: ansible_pkg_mgr == "apt"

    - name: APT - Print list of upgraded packages
      debug:
        msg: "Upgraded packages: {{ apt_upgrade_result.stdout_lines | default(['No updates applied']) }}"
      when: ansible_pkg_mgr == "apt" and apt_upgrade_result.changed

    - name: APT - Check if reboot is required
      stat:
        path: /var/run/reboot-required
      register: debian_reboot
      when: ansible_pkg_mgr == "apt"

    # ==========================================
    # RHEL / CentOS 7 (YUM)
    # ==========================================
    - name: YUM - Ensure yum-utils is installed
      yum:
        name: yum-utils
        state: present
      when: ansible_pkg_mgr == "yum"

    - name: YUM - Upgrade all packages
      yum:
        name: "*"
        state: latest
      register: yum_upgrade_result
      when: ansible_pkg_mgr == "yum"

    - name: YUM - Print list of upgraded packages
      debug:
        msg: "Upgraded packages: {{ yum_upgrade_result.changes.updated | default([]) | map(attribute='0') | list }}"
      when: ansible_pkg_mgr == "yum" and yum_upgrade_result.changed

    - name: YUM - Check if reboot is required
      command: needs-restarting -r
      register: yum_reboot
      failed_when: false
      changed_when: yum_reboot.rc == 1
      when: ansible_pkg_mgr == "yum"

    # ==========================================
    # RHEL / Alma / Rocky 8 and newer (DNF)
    # ==========================================
    - name: DNF - Ensure dnf-utils is installed
      dnf:
        name: dnf-utils
        state: present
      when: ansible_pkg_mgr == "dnf"

    - name: DNF - Upgrade all packages
      dnf:
        name: "*"
        state: latest
      register: dnf_upgrade_result
      when: ansible_pkg_mgr == "dnf"

    - name: DNF - Print list of upgraded packages
      debug:
        msg: "Upgraded packages: {{ dnf_upgrade_result.changes.updated | default([]) | map(attribute='0') | list }}"
      when: ansible_pkg_mgr == "dnf" and dnf_upgrade_result.changed

    - name: DNF - Check if reboot is required
      command: needs-restarting -r
      register: dnf_reboot
      failed_when: false
      changed_when: dnf_reboot.rc == 1
      when: ansible_pkg_mgr == "dnf"

    # ==========================================
    # Universal Reboot Handling
    # ==========================================
    - name: Reboot server if required
      reboot:
        msg: "Ansible automated patching reboot"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
      when: >
        (debian_reboot.stat.exists | default(false)) or 
        (yum_reboot.rc | default(0) == 1) or
        (dnf_reboot.rc | default(0) == 1)
